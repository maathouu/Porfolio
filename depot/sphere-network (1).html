<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sphère réseau rotative</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    height: 100%;
  }
  #sphere-container {
    width: 100%;
    height: 100vh;
    display: block;
    cursor: grab;
  }
  #sphere-container:active {
    cursor: grabbing;
  }
</style>
</head>
<body>

<div id="sphere-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const container = document.getElementById('sphere-container');

  // --- Scene setup ---
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.z = 6;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  // Group that will rotate (points + lines together)
  const globe = new THREE.Group();
  scene.add(globe);

  // --- Generate points on a sphere with a jittered/randomized layout ---
  // Base positions come from a Fibonacci sphere (so density stays even overall),
  // but each point gets nudged randomly along the surface so the pattern
  // reads as organic/hand-placed rather than a perfect grid.
  const NUM_POINTS = 220;
  const RADIUS = 2.4;
  const JITTER_AMOUNT = 0.38; // slightly tamed down to avoid big empty patches
  const points = [];

  function fibonacciSphere(samples, radius, jitter) {
    const pts = [];
    const phiGolden = Math.PI * (3 - Math.sqrt(5)); // golden angle
    for (let i = 0; i < samples; i++) {
      let y = 1 - (i / (samples - 1)) * 2; // y from 1 to -1
      let theta = phiGolden * i;

      // convert to spherical angles, jitter them, then rebuild the point
      let phi = Math.acos(Math.max(-1, Math.min(1, y)));
      phi += (Math.random() - 0.5) * jitter;
      theta += (Math.random() - 0.5) * jitter * 1.6;

      phi = Math.max(0.001, Math.min(Math.PI - 0.001, phi)); // clamp away from poles

      const sinPhi = Math.sin(phi);
      const x = sinPhi * Math.cos(theta);
      const yj = Math.cos(phi);
      const z = sinPhi * Math.sin(theta);

      pts.push(new THREE.Vector3(x * radius, yj * radius, z * radius));
    }
    return pts;
  }

  points.push(...fibonacciSphere(NUM_POINTS, RADIUS, JITTER_AMOUNT));

  // --- Soft round glow texture for points (nicer than flat squares) ---
  function makeGlowTexture() {
    const size = 128;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.35, 'rgba(255,255,255,0.7)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(canvas);
  }
  const glowTexture = makeGlowTexture();

  // --- Points as small glowing dots, darker toward the bottom ---
  const dotGeometry = new THREE.BufferGeometry().setFromPoints(points);

  // per-point base shade: steep fade from bright white (top) to near-black (bottom)
  const baseShades = [];
  const dotColors = [];
  for (const p of points) {
    const t = (p.y / RADIUS + 1) / 2;      // 0 at bottom, 1 at top
    const curved = Math.pow(t, 1.7);        // push the falloff lower for a more dramatic gradient
    const shade = 0.03 + curved * 0.97;     // near-black floor, full brightness at the top
    baseShades.push(shade);
    dotColors.push(shade, shade, shade);
  }
  dotGeometry.setAttribute('color', new THREE.Float32BufferAttribute(dotColors, 3));

  // twinkle phase per point, so a few dots subtly pulse brighter over time
  const twinklePhase = points.map(() => Math.random() * Math.PI * 2);
  const twinkleSpeed = points.map(() => 0.4 + Math.random() * 0.8);
  const twinkleStrength = points.map(() => (Math.random() < 0.35 ? 0.25 + Math.random() * 0.35 : 0));

  const dotMaterial = new THREE.PointsMaterial({
    size: 0.11,
    map: glowTexture,
    sizeAttenuation: true,
    transparent: true,
    opacity: 1,
    vertexColors: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const dotCloud = new THREE.Points(dotGeometry, dotMaterial);
  globe.add(dotCloud);

  // --- Connect nearby points with thin lines ---
  const MAX_LINK_DIST = 0.75;   // distance threshold for connecting two points
  const MAX_LINKS_PER_POINT = 4; // avoid an overly dense web

  const linePositions = [];
  const lineColors = [];

  function shadeFor(p) {
    const t = (p.y / RADIUS + 1) / 2; // 0 at bottom, 1 at top
    const curved = Math.pow(t, 1.7);
    return 0.02 + curved * 0.55;
  }

  for (let i = 0; i < points.length; i++) {
    let linksMade = 0;
    // find candidate neighbours
    const candidates = [];
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      const d = points[i].distanceTo(points[j]);
      if (d < MAX_LINK_DIST) {
        candidates.push({ j, d });
      }
    }
    candidates.sort((a, b) => a.d - b.d);
    for (const c of candidates) {
      if (linksMade >= MAX_LINKS_PER_POINT) break;
      // avoid duplicating a line already drawn from the other end
      if (c.j > i) {
        linePositions.push(
          points[i].x, points[i].y, points[i].z,
          points[c.j].x, points[c.j].y, points[c.j].z
        );
        const shadeA = shadeFor(points[i]);
        const shadeB = shadeFor(points[c.j]);
        lineColors.push(shadeA, shadeA, shadeA, shadeB, shadeB, shadeB);
      }
      linksMade++;
    }
  }

  const lineGeometry = new THREE.BufferGeometry();
  lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
  lineGeometry.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));
  const lineMaterial = new THREE.LineBasicMaterial({
    transparent: true,
    opacity: 0.35,
    vertexColors: true
  });
  const lineSegments = new THREE.LineSegments(lineGeometry, lineMaterial);
  globe.add(lineSegments);

  // --- Subtle outer glow sphere (atmosphere) ---
  const glowGeometry = new THREE.SphereGeometry(RADIUS * 1.015, 32, 32);
  const glowMaterial = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.035,
    wireframe: true
  });
  const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
  globe.add(glowMesh);

  // --- Auto rotation + drag-to-rotate ---
  let autoRotate = true;
  let isDragging = false;
  let prevX = 0, prevY = 0;
  let rotationVelocityY = 0.0006; // gentle default spin
  let rotationVelocityX = 0;

  container.addEventListener('pointerdown', (e) => {
    isDragging = true;
    autoRotate = false;
    prevX = e.clientX;
    prevY = e.clientY;
  });

  window.addEventListener('pointerup', () => {
    isDragging = false;
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - prevX;
    const deltaY = e.clientY - prevY;
    globe.rotation.y += deltaX * 0.005;
    globe.rotation.x += deltaY * 0.005;
    rotationVelocityY = deltaX * 0.0006;
    rotationVelocityX = deltaY * 0.0006;
    prevX = e.clientX;
    prevY = e.clientY;
  });

  // resume gentle auto-rotation after user stops interacting
  let resumeTimeout;
  container.addEventListener('pointerup', () => {
    clearTimeout(resumeTimeout);
    resumeTimeout = setTimeout(() => { autoRotate = true; }, 1500);
  });

  function animate() {
    requestAnimationFrame(animate);

    // twinkle: a subset of points pulse gently brighter and dimmer over time
    const t = performance.now() * 0.001;
    const colorAttr = dotGeometry.attributes.color;
    for (let i = 0; i < points.length; i++) {
      if (twinkleStrength[i] === 0) continue;
      const pulse = (Math.sin(t * twinkleSpeed[i] + twinklePhase[i]) + 1) / 2; // 0..1
      const shade = Math.min(1, baseShades[i] + pulse * twinkleStrength[i]);
      colorAttr.setXYZ(i, shade, shade, shade);
    }
    colorAttr.needsUpdate = true;

    if (autoRotate) {
      globe.rotation.y += 0.0006;
    } else if (!isDragging) {
      // inertia decay after drag release
      globe.rotation.y += rotationVelocityY;
      globe.rotation.x += rotationVelocityX;
      rotationVelocityY *= 0.95;
      rotationVelocityX *= 0.95;
    }

    renderer.render(scene, camera);
  }
  animate();

  // --- Responsive resize ---
  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
})();
</script>

</body>
</html>
